<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Вход</title>
<style>body{font-family:sans-serif;max-width:340px;margin:80px auto;padding:20px}
input,button{width:100%;padding:10px;margin:6px 0;font-size:14px;box-sizing:border-box}
.err{color:#c00;font-size:13px;margin-top:8px}</style>
</head><body>
<h2>AI ERP — вход</h2>
<input id="u" placeholder="Логин" autocomplete="username">
<input id="p" type="password" placeholder="Пароль" autocomplete="current-password">
<button onclick="doLogin()">Войти</button>
<div class="err" id="err"></div>
<script>
async function doLogin(){
  const fd = new URLSearchParams();
  fd.append('username', document.getElementById('u').value);
  fd.append('password', document.getElementById('p').value);
  const r = await fetch('/api/auth/login', {method:'POST', body: fd});
  if(!r.ok){ document.getElementById('err').textContent = 'Неверный логин или пароль'; return; }
  const data = await r.json();
  localStorage.setItem('token', data.access_token);
  localStorage.setItem('role', data.role);
  location.href = '/app';
}
</script>
</body></html>
